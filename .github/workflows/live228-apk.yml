name: Build LIVE228 v0.4 Overlay APK

on:
  push:
    branches:
      - live228-v04-overlay
    paths:
      - 'live228-apk/**'
      - '.github/workflows/live228-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live228-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build overlay debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LIVE228-Clash-v0.4-overlay.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE228-Clash-v0.4-overlay
          path: live228-apk/app/build/outputs/apk/debug/LIVE228-Clash-v0.4-overlay.apk
          if-no-files-found: error
